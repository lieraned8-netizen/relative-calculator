<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>親戚稱謂計算機</title>
<style>
:root{--bg:#e9ece8;--ink:#1d2a2c;--sub:#5b6a6a;--body:#22343a;--lcd:#dbe7dc;--lcd-ink:#1c2b24;--k-sys:#4b5d63;--k-par:#2f6f73;--k-sib:#3d6d9c;--k-sp:#8a5a8f;--k-kid:#b27a2c;--eq:#c8412f;--card:#f6f8f5;--line:#cfd6d0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121819;--ink:#e3ebe8;--sub:#93a3a0;--card:#1b2427;--line:#2d3a3d}}
:root[data-theme="dark"]{--bg:#121819;--ink:#e3ebe8;--sub:#93a3a0;--card:#1b2427;--line:#2d3a3d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100%;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px)}
.wrap{max-width:420px;margin:0 auto;padding:18px 0 28px}
h1{font-size:18px;margin:0 0 4px;font-weight:700}
.tip{font-size:13px;color:var(--sub);margin:0 0 14px;line-height:1.6}
.calc{background:var(--body);border-radius:22px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.lcd{background:var(--lcd);color:var(--lcd-ink);border-radius:12px;padding:12px 14px;min-height:196px;display:flex;flex-direction:column;justify-content:space-between}
.path{font-size:15px;line-height:1.7;min-height:52px;word-break:break-all}
.path b{font-weight:500;background:rgba(28,43,36,.12);border-radius:6px;padding:1px 7px;margin-right:2px;display:inline-block}
.path i{font-style:normal;opacity:.55;margin-right:2px}
.res{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:40px;font-weight:700;text-align:right;line-height:1.25;margin-top:8px;overflow-wrap:anywhere}
.res.long{font-size:30px}
.formal{text-align:right;font-size:14px;min-height:20px}
.tw{text-align:right;font-size:14px;min-height:20px;margin-top:2px;font-weight:500}
.note{text-align:right;font-size:13px;opacity:.8;min-height:20px;line-height:1.5;margin-top:2px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
button{font:inherit;border:0;border-radius:12px;color:#fff;font-size:18px;font-weight:600;min-height:56px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.28);-webkit-tap-highlight-color:transparent}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sys{background:var(--k-sys)}.par{background:var(--k-par)}.sib{background:var(--k-sib)}.sp{background:var(--k-sp)}.kid{background:var(--k-kid)}
.eq{background:var(--eq);grid-column:1/-1;min-height:52px}
.hist{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.hist h2{font-size:14px;margin:0 0 8px}
.hist ul{list-style:none;margin:0;padding:0;font-size:14px}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist li span:last-child{font-weight:700;text-align:right}
.empty{color:var(--sub);font-size:13px}
.clr{background:none;color:var(--sub);box-shadow:none;font-size:13px;min-height:0;padding:0;margin-top:8px;font-weight:400;text-decoration:underline}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.tools button{min-height:48px;font-size:16px}
.foot{font-size:12px;color:var(--sub);line-height:1.7;margin-top:16px}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>親戚稱謂計算機</h1>
  <p class="tip">從「我」出發，依序按下關係，例如「爸爸 → 哥哥 → 老婆」，就會算出該怎麼稱呼（台灣用語）。</p>

  <div class="calc">
    <div class="lcd" aria-live="polite">
      <div class="path" id="path"></div>
      <div>
        <div class="res" id="res">我</div>
        <div class="formal" id="formal"></div>
        <div class="tw" id="tw"></div>
        <div class="note" id="note"></div>
      </div>
    </div>
    <div class="keys">
      <button class="sys" data-act="ac">AC</button>
      <button class="sys" data-act="del" aria-label="刪除上一步">⌫</button>
      <button class="par" data-k="F">爸爸</button>
      <button class="par" data-k="M">媽媽</button>
      <button class="sib" data-k="E">哥哥</button>
      <button class="sib" data-k="L">弟弟</button>
      <button class="sib" data-k="e">姊姊</button>
      <button class="sib" data-k="l">妹妹</button>
      <button class="sp" data-k="H">老公</button>
      <button class="sp" data-k="W">老婆</button>
      <button class="kid" data-k="S">兒子</button>
      <button class="kid" data-k="D">女兒</button>
      <button class="eq" data-act="eq">＝ 記下這個稱謂</button>
    </div>
  </div>

  <div class="tools"><button class="sys" id="say">朗讀</button><button class="sys" id="share">分享</button><button class="par" id="fam">存入家人</button></div>
  <div class="hist" style="margin-top:14px"><h2>我的家人（點右側可刪除）</h2><ul id="famlist"></ul></div>

  <div class="hist">
    <h2>最近查詢</h2>
    <ul id="hist"></ul>
    <button class="clr" id="clr" hidden>清除紀錄</button>
  </div>

  <p class="foot">稱謂會因家族、地區與族群（閩南、客家等）略有差異，本工具以台灣常見用法為主，僅供參考；有排行時可在稱謂前加「大、二、三…」，最小的常加「小」或「么」。</p>
</div>

大舅|舅仔|kū-á

外孫女|外孫女|guā-sun-lú

// 堂／表＋輩分（例：表舅）用的詞根
const TWBASE = `
伯|伯|peh
叔|叔|tsik
姑|姑|koo
舅|舅|kū
姨|姨|î
伯母|伯姆|peh-ḿ
嬸嬸|嬸|tsím
舅媽|妗|kīm
姨丈|姨丈|î-tiūnn
姑丈|姑丈|koo-tiūnn
姪子|姪仔|tit-á
姪女|姪女|tit-lú
嫂|嫂|só
姊夫|姊夫|tsé-hu
妹夫|妹婿|muē-sài
外甥|外甥|guā-sing
外甥女|外甥女|guā-sing-lú
`;
const TW = {}, TWB = {};
const loadTW = (txt, o) => txt.trim().split("\n").forEach(l => { const [k, h, t] = l.split("|"); o[k] = [h, t]; });
loadTW(TWRAW, TW); loadTW(TWBASE, TWB);
function twOne(c) {
  if (TW[c]) return TW[c];
  let m = c.match(/^(堂|表)(.+)$/);
  if (m && TWB[m[2]]) return [m[1] + TWB[m[2]][0], (m[1] === "堂" ? "tông-" : "piáu-") + TWB[m[2]][1]];
  m = c.match(/^外(.+)$/);
  if (m && TW[m[1]]) return ["外" + TW[m[1]][0], "guā-" + TW[m[1]][1]];
  return null;
}
function twOf(call) {
  const r = call.split("／").map(twOne);
  if (!r.length || r.some(x => !x)) return null;
  return [r.map(x => x[0]).join("／"), r.map(x => x[1]).join("／")];
}

const LABEL = {F:"爸爸",M:"媽媽",E:"哥哥",L:"弟弟",e:"姊姊",l:"妹妹",H:"老公",W:"老婆",S:"兒子",D:"女兒"};
// 路徑簡化：爸爸的老婆＝媽媽、媽媽的老公＝爸爸、自己的配偶之子女＝子女
function normalize(p) {
  let s = p, prev;
  do {
    prev = s;
    s = s.replace(/FW/g, "M").replace(/MH/g, "F")
         .replace(/[HW]([SD])/g, "$1").replace(/^[HW]([EeLl][SD]+)$/, "$1")
         .replace(/([EeLl])([FM])/g, "$2")
         .replace(/[Ee]([Ee])/g, "$1").replace(/[Ll]([Ll])/g, "$1");
  } while (s !== prev);
  return s;
}

// 規則推算：資料表沒有的較遠關係，依規則組合
function derive(k) {
  let m;
  if ((m = k.match(/^[FM]{4}$/))) { const f = k[3] === "F"; return {call: (k[0] === "M" ? "外" : "") + (f ? "高祖父" : "高祖母"), formal: f ? "高祖父" : "高祖母", note: "曾祖父母的父母"}; }
  if ((m = k.match(/^[SD]{3,4}$/))) { const g = k.length === 3 ? "曾孫" : "玄孫", d = k.slice(-1) === "D" ? "女" : ""; const c = (k[0] === "D" ? "外" : "") + g + d; return {call: c, formal: c, note: k.length === 3 ? "孫子的孩子" : "曾孫的孩子"}; }
  // 父母的堂／表兄弟姊妹
  if ((m = k.match(/^([FM])([FM])([EeLl])([SD])([HW])?$/))) {
    const [, P, G, X, C, sp] = m;
    const tang = G === "F" && (X === "E" || X === "L"), pf = tang ? "堂" : "表";
    if (sp && !((C === "S" && sp === "W") || (C === "D" && sp === "H"))) return null;
    let call, formal;
    if (P === "F") {
      if (C === "S") { call = sp ? pf + "伯母／" + pf + "嬸嬸" : pf + "伯／" + pf + "叔"; formal = sp ? pf + "伯母／" + pf + "叔母" : pf + "伯父／" + pf + "叔父"; }
      else { call = sp ? pf + "姑丈" : pf + "姑"; formal = sp ? pf + "姑丈" : pf + "姑母"; }
    } else {
      if (C === "S") { call = pf + (sp ? "舅媽" : "舅"); formal = pf + (sp ? "舅母" : "舅父"); }
      else { call = pf + (sp ? "姨丈" : "姨"); formal = pf + (sp ? "姨丈" : "姨母"); }
    }
    return {call, formal, note: (P === "F" ? "爸爸" : "媽媽") + "的" + pf + "兄弟姊妹" + (sp ? "的配偶" : "") + (P === "F" && C === "S" && !sp ? "；比爸爸大叫伯，比爸爸小叫叔" : "")};
  }
  // 堂／表兄弟姊妹的孩子或配偶
  if ((m = k.match(/^([FM])([EeLl])([SD])([SD])$/))) {
    const pf = m[1] === "F" && (m[2] === "E" || m[2] === "L") ? "堂" : "表";
    const c = pf + (m[3] === "S" ? (m[4] === "S" ? "姪子" : "姪女") : (m[4] === "S" ? "外甥" : "外甥女"));
    return {call: c, formal: c, note: "堂表兄弟姊妹的孩子"};
  }
  if ((m = k.match(/^([FM])([EeLl])([SD])([HW])$/))) {
    if ((m[3] === "S") !== (m[4] === "W")) return null;
    const pf = m[1] === "F" && (m[2] === "E" || m[2] === "L") ? "堂" : "表";
    const c = m[3] === "S" ? pf + "嫂／" + pf + "弟媳" : pf + "姊夫／" + pf + "妹夫";
    return {call: c, formal: c, note: "依對方比你大或小選擇稱呼"};
  }
  // 姪孫、外甥孫
  if ((m = k.match(/^([EeLl])([SD])([SD])$/))) {
    const bro = m[1] === "E" || m[1] === "L";
    if (!bro && m[2] === "D") return null;
    const c = (bro ? (m[2] === "S" ? "姪孫" : "姪外孫") : "外甥孫") + (m[3] === "D" ? "女" : "");
    return {call: c, formal: c, note: "兄弟姊妹的孫輩"};
  }
  return null;
}
const GEN = {F: 1, M: 1, S: -1, D: -1};
function resolve(path) {
  const key = normalize(path);
  if (DB[key]) return DB[key];
  const d = derive(key); if (d) return d;
  const m = key.match(/^([HW])([FM].+)$/);   // 配偶的長輩：跟著配偶叫
  if (m) {
    const r = resolve(m[2]);
    if (r) { const w = m[1] === "H" ? "先生" : "太太"; return {call: r.call, formal: (m[1] === "H" ? "夫之" : "妻之") + r.formal, note: "跟著" + w + "稱呼（對方是" + w + "的長輩）"}; }
  }
  return null;
}
function lookup(path) {
  if (!path) return {call: "我", formal: "", note: "請從下方選擇第一個關係"};
  const r = resolve(path); if (r) return r;
  const key = normalize(path);
  let g = 0; [...key].forEach(k => g += GEN[k] || 0);
  let known = null, n = 0;
  for (let i = key.length - 1; i >= 1; i--) { const x = resolve(key.slice(0, i)); if (x) { known = x; n = i; break; } }
  const rest = [...key.slice(n)].map(k => LABEL[k]).join("的");
  const gt = g > 0 ? "長輩（高你 " + g + " 輩）" : g < 0 ? "晚輩（低你 " + (-g) + " 輩）" : "平輩";
  const tip = g < 0 ? "晚輩通常直接叫名字即可。" : g > 0 ? "長輩可依家人的叫法稱呼，或請教父母。" : "平輩可依年紀叫「大哥／大姊」，或直接叫名字。";
  return {call: "關係較遠", formal: "", note: gt + "，" + (/[HW]/.test(key) ? "屬姻親" : "屬血親") + "。" + (known ? "可確認到「" + known.call + "」，再往下是：" + rest + "。" : "") + tip};
}

let path = "";
const $ = id => document.getElementById(id);
function render() {
  const el = $("path");
  el.innerHTML = "<i>我</i>" + [...path].map(k => "<i>的</i><b>" + LABEL[k] + "</b>").join("");
  const r = lookup(path);
  const res = $("res");
  res.textContent = r.call;
  res.classList.toggle("long", r.call.length > 6);
  $("formal").textContent = r.formal ? "正式稱謂：" + r.formal : "";
  $("note").textContent = r.note || "";
  const t = path ? twOf(r.call) : null;
  $("tw").textContent = t ? "閩南語：" + t[0] + "（" + t[1] + "）" : "";
}
function press(k) { if (path.length < 10) { path += k; render(); } }
let hist = [];
try { hist = JSON.parse(localStorage.getItem("kin-hist") || "[]"); } catch (e) {}
function renderHist() {
  const ul = $("hist");
  ul.innerHTML = "";
  if (!hist.length) { ul.innerHTML = '<li class="empty">按下「＝」就會記在這裡</li>'; $("clr").hidden = true; return; }
  hist.forEach(h => {
    const li = document.createElement("li");
    li.innerHTML = "<span></span><span></span>";
    li.children[0].textContent = "我的" + [...h.p].map(k => LABEL[k]).join("的");
    li.children[1].textContent = h.c;
    ul.appendChild(li);
  });
  $("clr").hidden = false;
}
function save() { try { localStorage.setItem("kin-hist", JSON.stringify(hist)); } catch (e) {} }

document.querySelector(".keys").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.k) return press(b.dataset.k);
  if (b.dataset.act === "ac") { path = ""; render(); }
  else if (b.dataset.act === "del") { path = path.slice(0, -1); render(); }
  else if (b.dataset.act === "eq" && path) {
    hist.unshift({p: path, c: lookup(path).call});
    hist = hist.slice(0, 8); save(); renderHist();
  }
});
$("clr").addEventListener("click", () => { hist = []; save(); renderHist(); });
let fam = [];
try { fam = JSON.parse(localStorage.getItem("kin-fam") || "[]"); } catch (e) {}
const saveFam = () => { try { localStorage.setItem("kin-fam", JSON.stringify(fam)); } catch (e) {} };
function renderFam() {
  const ul = $("famlist"); ul.innerHTML = "";
  if (!fam.length) { ul.innerHTML = '<li class="empty">查到稱謂後，按「存入家人」記下對方的名字</li>'; return; }
  fam.forEach((f, i) => {
    const li = document.createElement("li"); li.innerHTML = "<span></span><span></span>";
    li.children[0].textContent = f.n; li.children[1].textContent = f.c + "　✕";
    li.children[1].onclick = () => { if (confirm("刪除「" + f.n + "」？")) { fam.splice(i, 1); saveFam(); renderFam(); } };
    ul.appendChild(li);
  });
}
const cur = () => lookup(path).call;
$("say").onclick = () => { if (!path || !window.speechSynthesis) return; const u = new SpeechSynthesisUtterance(cur().replace("／", "，")); u.lang = "zh-TW"; speechSynthesis.cancel(); speechSynthesis.speak(u); };
$("share").onclick = () => {
  if (!path) return;
  const t = "我的" + [...path].map(k => LABEL[k]).join("的") + "，要叫「" + cur() + "」";
  if (navigator.share) navigator.share({text: t}).catch(() => {}); else if (navigator.clipboard) navigator.clipboard.writeText(t);
};
$("fam").onclick = () => {
  if (!path) return;
  const n = prompt("對方的名字？（只存在這支手機）"); if (!n) return;
  fam.unshift({n: n.trim().slice(0, 20), c: cur()}); fam = fam.slice(0, 50); saveFam(); renderFam();
};
render(); renderHist(); renderFam();
</script>
